services:
  - type: web
    name: todo-list-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: SPREADSHEET_NAME
        value: TodoApp
      - key: GOOGLE_OAUTH_CLIENT_SECRET_JSON
        sync: false
      - key: GOOGLE_OAUTH_TOKEN_JSON
        sync: false
