<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Todo リスト{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
           max-width: 760px; margin: 0 auto; padding: 24px; color: #222; }
    h1 { font-size: 1.5rem; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .btn { display: inline-block; padding: 8px 16px; background: #2563eb;
           color: #fff; border-radius: 6px; border: none; cursor: pointer;
           font-size: 0.95rem; }
    .btn:hover { background: #1d4ed8; text-decoration: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb;
             vertical-align: top; }
    th { background: #f9fafb; font-size: 0.85rem; color: #6b7280; }
    .flash { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46;
             padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; }
    input[type=text], input[type=date], textarea {
      width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 1rem; box-sizing: border-box; }
    textarea { min-height: 90px; resize: vertical; }
    .empty { color: #6b7280; margin-top: 24px; }
    .btn-delete { background: none; border: none; color: #dc2626; cursor: pointer;
                  font-size: 0.95rem; padding: 0 0 0 12px; }
    .btn-delete:hover { text-decoration: underline; }
    input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
    tr.completed td { color: #9ca3af; text-decoration: line-through; }
    .priority { display: inline-block; padding: 2px 10px; border-radius: 999px;
                font-size: 0.8rem; font-weight: 600; }
    .priority-high { background: #fee2e2; color: #b91c1c; }
    .priority-mid { background: #fef3c7; color: #92400e; }
    .priority-low { background: #e0f2fe; color: #0369a1; }
    tr.completed .priority { background: #f3f4f6; color: #9ca3af; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                 gap: 12px; margin: 16px 0 24px; }
    .stat-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;
                 padding: 14px 16px; }
    .stat-card .label { font-size: 0.8rem; color: #6b7280; }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
    .stat-section { margin-bottom: 24px; }
    .stat-section h2 { font-size: 1.1rem; margin-bottom: 8px; }
    .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .progress-row .progress-label { width: 70px; flex-shrink: 0; font-size: 0.9rem; }
    .progress-bar { flex: 1; height: 10px; background: #e5e7eb; border-radius: 999px;
                    overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #2563eb; border-radius: 999px; }
    .progress-count { width: 90px; flex-shrink: 0; font-size: 0.85rem; color: #6b7280;
                       text-align: right; }
  </style>
</head>
<body>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
