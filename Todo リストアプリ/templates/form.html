{% extends "base.html" %}
{% block title %}{% if action == 'edit' %}やることの編集{% else %}やることの登録{% endif %}{% endblock %}
{% block content %}
  <h1>{% if action == 'edit' %}やることの編集{% else %}やることの登録{% endif %}</h1>

  <form method="post">
    <div class="field">
      <label for="title">タイトル <span style="color:#dc2626">*</span></label>
      <input type="text" id="title" name="title" value="{{ todo.title or '' }}" required>
    </div>
    <div class="field">
      <label for="content">内容</label>
      <textarea id="content" name="content">{{ todo.content or '' }}</textarea>
    </div>
    <div class="field">
      <label for="due_date">期日</label>
      <input type="date" id="due_date" name="due_date" value="{{ todo.due_date or '' }}">
    </div>
    <button class="btn" type="submit">
      {% if action == 'edit' %}更新する{% else %}登録する{% endif %}
    </button>
    <a href="{{ url_for('index') }}" style="margin-left:12px">キャンセル</a>
  </form>
{% endblock %}
